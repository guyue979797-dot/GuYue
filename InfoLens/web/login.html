<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · CRM图片处理</title>
  <style>
    :root {
      color-scheme: light;
      --primary-1: #eef2ff;
      --primary-2: #e0e7ff;
      --primary-5: #818cf8;
      --primary-6: #4f46e5;
      --primary-7: #4338ca;
      --primary-8: #3730a3;
      --gray-50: #f8fafc;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --white: #ffffff;
      --error-600: #dc2626;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--gray-800);
      background: var(--gray-50);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 480px;
      background:
        linear-gradient(120deg, rgba(79, 70, 229, .08), transparent 42%),
        var(--gray-50);
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      position: relative;
      padding: 64px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      overflow: hidden;
      isolation: isolate;
      color: var(--white);
      background:
        linear-gradient(135deg, var(--primary-2) 0%, var(--primary-5) 46%, var(--primary-6) 100%);
    }
    .brand::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, .62), transparent 30%),
        linear-gradient(135deg, rgba(49, 46, 129, .08), rgba(30, 27, 75, .18));
      pointer-events: none;
    }
    .brand-logo {
      position: relative;
      display: flex;
      align-items: center;
      color: var(--white);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 2px 14px rgba(30, 27, 75, .22);
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      margin-right: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, .92);
      color: var(--primary-8);
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 16px 34px rgba(0, 0, 0, .18);
    }
    .brand-slogan {
      max-width: 420px;
      color: rgba(255, 255, 255, .9);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.7;
      text-shadow: 0 2px 16px rgba(30, 27, 75, .24);
    }
    .panel {
      min-height: 100vh;
      padding: 48px;
      display: flex;
      align-items: center;
      background: var(--white);
      border-left: 1px solid var(--gray-200);
      box-shadow: -14px 0 36px rgba(15, 23, 42, .05);
    }
    form { width: 100%; }
    h2 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .hint {
      margin: 0 0 28px;
      color: var(--gray-400);
      font-size: 14px;
    }
    label {
      display: block;
      margin: 16px 0 8px;
      color: var(--gray-600);
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      outline: none;
      background: var(--gray-50);
      color: var(--gray-800);
      font-size: 14px;
    }
    input:focus {
      border-color: var(--primary-6);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
      background: var(--white);
    }
    button {
      width: 100%;
      height: 44px;
      margin-top: 24px;
      border: 0;
      border-radius: 6px;
      background: var(--primary-6);
      color: var(--white);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    button:hover { background: var(--primary-7); }
    .error {
      min-height: 22px;
      margin-bottom: 2px;
      color: var(--error-600);
      font-size: 13px;
    }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      .brand { display: none; }
      .panel {
        min-height: 100vh;
        padding: 32px 22px;
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <section class="brand">
    <div class="brand-logo">
      <span class="brand-mark">XXC</span>
      <span>贵州鑫向晨商贸工作台</span>
    </div>
    <div class="brand-slogan">本地商户酒饮供应链协同工作台</div>
  </section>
  <main class="panel">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
      <h2>账号登录</h2>
      <p class="hint">请输入管理员分配的账号和密码。</p>
      <div class="error" aria-live="polite">{{ERROR}}</div>
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录系统</button>
    </form>
  </main>
</body>
</html>
